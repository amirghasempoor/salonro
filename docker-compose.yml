services:
  nginx:
    image: docker.arvancloud.ir/nginx:stable-alpine3.23-perl
    container_name: salonro-nginx
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - ./nginx/salonro.conf:/etc/nginx/conf.d/default.conf
      - ${BACKEND_PATH}:/var/www/${PROJECT_NAME}
    depends_on:
      - backend
    networks:
      - payment

  redis:
    image: docker.arvancloud.ir/redis:8.6.0-alpine3.23
    container_name: salonro-redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment

  postgres:
    image: docker.arvancloud.ir/postgres:18.2-alpine3.23
    container_name: salonro-db
    restart: unless-stopped
    ports:
      - "8093:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - payment-db:/var/lib/postgresql
    networks:
      - payment

  backend:
    build:
      context: ${BACKEND_PATH}
      dockerfile: Dockerfile
    container_name: salonro-laravel
    restart: unless-stopped
    volumes:
      - ${BACKEND_PATH}:/var/www/${PROJECT_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payment

volumes:
  payment-db:
    driver: local

networks:
  payment:
    driver: bridge
