# GitLab CI for SalonRo
#
# Requires a runner with the Docker executor and network access to:
#   - the GitLab Container Registry ($CI_REGISTRY)
#
# Deploy stage needs these CI/CD variables:
#   DEPLOY_HOST       - server host (IP or FQDN)
#   DEPLOY_USER       - SSH user on the server
#   DEPLOY_PATH       - absolute path to the repo clone on the server
#   DEPLOY_SSH_KEY    - SSH private key (File type, ed25519 or rsa)
#
# `$CI_REGISTRY*` variables are provided automatically by GitLab.
#
# IMPORTANT — server-side requirement for the deploy stage to work:
#   docker-compose.yml on the server must reference the registry image
#   instead of building locally, e.g.:
#
#     services:
#       backend:
#         image: ${CI_REGISTRY_IMAGE}/backend:${TAG}
#         # no `build:` key here
#
#   The deploy job below exports TAG and CI_REGISTRY_IMAGE, then runs
#   `docker compose pull && docker compose up -d`. If the server's
#   compose file still has a `build:` key, it will be ignored by `pull`
#   but `up -d` alone won't rebuild — so this compose file change is
#   required, not optional, before enabling deploy.

stages:
  - lint
  - test
#  - build
#  - deploy

variables:
  COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.composer-cache
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_IMAGE: composer:latest
  DOCKER_IMAGE: docker:27
  DIND_IMAGE: docker:27-dind

default:
  image: $COMPOSER_IMAGE
  interruptible: true
  cache:
    key:
      files:
        - backend/composer.lock
    paths:
      - backend/vendor/
      - .composer-cache/

lint:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - cd backend
    - composer install --prefer-dist --no-progress --no-interaction
    - vendor/bin/pint --test

test:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - apk add --no-cache freetype-dev libjpeg-turbo-dev libpng-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install -j"$(nproc)" gd
  script:
    - cd backend
    - composer install --prefer-dist --no-progress --no-interaction
    - cp .env.example .env
    - php artisan key:generate --ansi
    - php artisan test

